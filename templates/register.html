{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
<div class="eyebrow">YOUR NEXT STEP</div>
<h1>A space for your care.</h1>
<p class="lead">Create a demo patient account using fictional information.</p>
</div>
<section class="panel narrow">
<h2>Create account</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-grid">
<div>
<label for="first_name">First name</label>
<input id="first_name" name="first_name" autocomplete="given-name" maxlength="50" required>
</div>
<div>
<label for="last_name">Last name</label>
<input id="last_name" name="last_name" autocomplete="family-name" maxlength="50" required>
</div>
</div>
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="password-help" required>
<p id="password-help" class="muted small">Use 12–128 characters. A memorable passphrase works well.</p>
<button class="button full">Create patient account →</button>
</form>
<p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>
</p>
</section>
{% endblock %}
